plugins { id 'com.android.application' }

def serverOrigin = providers.gradleProperty('studyMindServerUrl')
    .orElse(providers.environmentVariable('STUDYMIND_SERVER_URL')).getOrElse('')
def origin = serverOrigin ? new URI(serverOrigin) : null
if (origin == null || origin.scheme != 'https' || !origin.host || origin.userInfo
        || origin.query || origin.fragment || !(origin.path in ['', '/'])) {
    throw new GradleException('Configure STUDYMIND_SERVER_URL com a origem HTTPS do backend StudyMind, sem caminho ou credenciais.')
}

android {
    namespace 'com.studymind.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.studymind.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SERVER_ORIGIN', '"' + serverOrigin.replaceAll('/$', '') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
