services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${STUDYMIND_DOMAIN:?Defina STUDYMIND_DOMAIN com o dominio publico}
    volumes:
      - study-data:/app/data
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      STUDYMIND_DOMAIN: ${STUDYMIND_DOMAIN:?Defina STUDYMIND_DOMAIN com o dominio publico}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  study-data:
  caddy-data:
  caddy-config:
